spring.application.name=jobscout

server.port=${PORT:8080}

spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,prometheus

spring.datasource.url=jdbc:postgresql://localhost:5438/jobscout
spring.datasource.username=jobscout
spring.datasource.password=jobscout

spring.mvc.problemdetails.enabled=true

spring.elasticsearch.uris=http://localhost:9200
jobscout.search.index=jobs

spring.kafka.bootstrap-servers=localhost:9095

jobscout.cdc.connect-url=http://localhost:8083
jobscout.cdc.connector-name=jobscout-postgres
jobscout.cdc.topic-prefix=jobscout
jobscout.cdc.register-timeout=90s
jobscout.cdc.database.host=postgres
jobscout.cdc.database.port=5432
jobscout.cdc.database.name=jobscout
jobscout.cdc.database.user=jobscout
jobscout.cdc.database.password=jobscout

spring.kafka.consumer.group-id=jobscout-indexer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=3
